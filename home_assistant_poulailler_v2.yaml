# ============================================================
#  HOME ASSISTANT — Porte Poulailler Automatique v2
#  À ajouter dans configuration.yaml
#
#  Les entités MQTT (porte, mode, capteurs, réglages) sont créées
#  AUTOMATIQUEMENT par l'ESP32 via MQTT Discovery (appareil
#  « Porte Poulailler »). Ne pas les redéclarer ici : mêmes unique_id
#  → conflit dans HA.
#
#  Ce fichier ne contient que des compléments : capteurs dérivés,
#  automatisations d'alerte et un exemple de tableau de bord.
#
#  Identifiants d'entités créés par la Discovery (à vérifier dans
#  Paramètres → Appareils → Porte Poulailler, ils peuvent différer
#  si tu les as renommés) :
#    cover.porte_poulailler_porte
#    select.porte_poulailler_mode
#    sensor.porte_poulailler_heures_soleil
#    sensor.porte_poulailler_luminosite
#    sensor.porte_poulailler_courant_moteur
#    number.porte_poulailler_offset_ouverture / _fermeture
#    number.porte_poulailler_seuil_lux_ouverture / _fermeture
#    number.porte_poulailler_confirmation_luminosite
# ============================================================

# ── Template sensors ────────────────────────────────────────
template:
  - sensor:
      - name: "Lever Soleil Poulailler"
        unique_id: poulailler_lever
        state: >
          {{ state_attr('sensor.porte_poulailler_heures_soleil', 'lever') | default('--:--') }}
        icon: mdi:weather-sunset-up

      - name: "Coucher Soleil Poulailler"
        unique_id: poulailler_coucher
        state: >
          {{ state_attr('sensor.porte_poulailler_heures_soleil', 'coucher') | default('--:--') }}
        icon: mdi:weather-sunset-down

      - name: "Heure Ouverture Poulailler"
        unique_id: poulailler_heure_ouv
        state: >
          {{ state_attr('sensor.porte_poulailler_heures_soleil', 'ouverture') | default('--:--') }}
        icon: mdi:door-sliding-open

      - name: "Heure Fermeture Poulailler"
        unique_id: poulailler_heure_fer
        state: >
          {{ state_attr('sensor.porte_poulailler_heures_soleil', 'fermeture') | default('--:--') }}
        icon: mdi:door-sliding

      # Mode en cours formaté lisiblement
      - name: "Mode Poulailler Lisible"
        unique_id: poulailler_mode_lisible
        state: >
          {% set m = states('select.porte_poulailler_mode') %}
          {% if m == 'soleil' %}🌅 Lever/coucher du soleil
          {% elif m == 'luminosite' %}💡 Luminosité
          {% elif m == 'heure_fixe' %}🕐 Heure fixe
          {% elif m == 'manuel' %}🖐 Manuel
          {% else %}Inconnu
          {% endif %}

# ── Automatisations ─────────────────────────────────────────
# (une seule clé « automation: » — une clé en double est ignorée par HA)
automation:

  # Alerte erreur porte (timeout, surintensité, position inconnue)
  - id: poulailler_alerte_erreur
    alias: "Poulailler — Alerte erreur porte"
    trigger:
      - platform: mqtt
        topic: "poulailler/porte/etat"
        payload: "error"
    action:
      - service: notify.mobile_app
        data:
          title: "⚠️ Poulailler"
          message: >
            Erreur porte poulailler — vérifier l'installation.
            Heure : {{ now().strftime('%H:%M') }}

  # Alerte ESP32 hors ligne (LWT MQTT)
  - id: poulailler_alerte_hors_ligne
    alias: "Poulailler — ESP32 hors ligne"
    trigger:
      - platform: mqtt
        topic: "poulailler/status"
        payload: "offline"
    action:
      - service: notify.mobile_app
        data:
          title: "📡 Poulailler"
          message: "Le contrôleur de la porte ne répond plus (WiFi/MQTT)."

  # Alerte porte ouverte la nuit
  - id: poulailler_alerte_nuit_ouverte
    alias: "Poulailler — Porte ouverte la nuit"
    trigger:
      - platform: time
        at: "23:00:00"
    condition:
      - condition: state
        entity_id: cover.porte_poulailler_porte
        state: "open"
    action:
      - service: notify.mobile_app
        data:
          title: "🐔 Poulailler"
          message: "La porte est encore ouverte à 23h !"

  # Alerte surcourant (courant moteur > 2 A)
  - id: poulailler_alerte_surcourant
    alias: "Poulailler — Alerte surcourant moteur"
    trigger:
      - platform: numeric_state
        entity_id: sensor.porte_poulailler_courant_moteur
        above: 2.0
        for:
          seconds: 5
    action:
      - service: notify.mobile_app
        data:
          title: "⚡ Poulailler"
          message: >
            Surcourant détecté : {{ states('sensor.porte_poulailler_courant_moteur') }} A
            La porte a été arrêtée automatiquement.

# ── Envoi de la configuration complète via un seul topic JSON ──
# Optionnel (les réglages sont déjà exposés en entités « number ») :
# service mqtt.publish, topic: poulailler/config
# payload: {"offset_ouv":15,"offset_fer":-10}
# Clés disponibles :
#   offset_ouv, offset_fer               (mode soleil, -60 à 120 min)
#   lux_ouv, lux_fer, lux_conf           (mode luminosité, lux_conf 10 à 300 s)
#   hfx_ouv_h, hfx_ouv_m, hfx_ouv_off   (mode heure fixe ouverture, offset -120 à 120)
#   hfx_fer_h, hfx_fer_m, hfx_fer_off   (mode heure fixe fermeture)

