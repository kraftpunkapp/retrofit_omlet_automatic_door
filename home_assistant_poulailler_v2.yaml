# ============================================================
#  HOME ASSISTANT — Porte Poulailler Automatique v2
#  À ajouter dans configuration.yaml
# ============================================================

# ── MQTT Cover (porte) ──────────────────────────────────────
mqtt:
  cover:
    - name: "Porte Poulailler"
      unique_id: poulailler_porte
      command_topic: "poulailler/porte/commande"
      state_topic: "poulailler/porte/etat"
      payload_open: "OPEN"
      payload_close: "CLOSE"
      payload_stop: "STOP"
      state_open: "open"
      state_closed: "closed"
      state_opening: "opening"
      state_closing: "closing"
      optimistic: false
      device_class: gate
      icon: mdi:door-sliding

  sensor:
    - name: "Luminosité Poulailler"
      unique_id: poulailler_lux
      state_topic: "poulailler/capteurs/lux"
      unit_of_measurement: "lx"
      device_class: illuminance
      icon: mdi:weather-sunny

    - name: "Courant Moteur Poulailler"
      unique_id: poulailler_courant
      state_topic: "poulailler/capteurs/courant"
      unit_of_measurement: "A"
      device_class: current
      icon: mdi:current-ac

    - name: "Heures Soleil Poulailler"
      unique_id: poulailler_soleil
      state_topic: "poulailler/soleil/heures"
      value_template: "{{ value_json.ouverture }} / {{ value_json.fermeture }}"
      json_attributes_topic: "poulailler/soleil/heures"
      json_attributes_template: "{{ value_json | tojson }}"
      icon: mdi:weather-sunset

  select:
    - name: "Mode Porte Poulailler"
      unique_id: poulailler_mode
      command_topic: "poulailler/mode"
      state_topic: "poulailler/mode"
      options:
        - "soleil"
        - "luminosite"
        - "heure_fixe"
        - "manuel"
      icon: mdi:cog

  # ── Envoi de la configuration complète via un seul topic JSON ──
  # Utiliser le service mqtt.publish depuis HA pour envoyer :
  # topic: poulailler/config
  # payload: {"offset_ouv":15,"offset_fer":-10}
  # Les clés disponibles :
  #   offset_ouv, offset_fer               (mode soleil)
  #   lux_ouv, lux_fer, lux_conf           (mode luminosité)
  #   hfx_ouv_h, hfx_ouv_m, hfx_ouv_off   (mode heure fixe ouverture)
  #   hfx_fer_h, hfx_fer_m, hfx_fer_off   (mode heure fixe fermeture)

# ── Template sensors ────────────────────────────────────────
template:
  - sensor:
      - name: "Lever Soleil Poulailler"
        unique_id: poulailler_lever
        state: >
          {{ state_attr('sensor.heures_soleil_poulailler', 'lever') | default('--:--') }}
        icon: mdi:weather-sunset-up

      - name: "Coucher Soleil Poulailler"
        unique_id: poulailler_coucher
        state: >
          {{ state_attr('sensor.heures_soleil_poulailler', 'coucher') | default('--:--') }}
        icon: mdi:weather-sunset-down

      - name: "Heure Ouverture Poulailler"
        unique_id: poulailler_heure_ouv
        state: >
          {{ state_attr('sensor.heures_soleil_poulailler', 'ouverture') | default('--:--') }}
        icon: mdi:door-sliding-open

      - name: "Heure Fermeture Poulailler"
        unique_id: poulailler_heure_fer
        state: >
          {{ state_attr('sensor.heures_soleil_poulailler', 'fermeture') | default('--:--') }}
        icon: mdi:door-sliding

      # Mode en cours formaté lisiblement
      - name: "Mode Poulailler Lisible"
        unique_id: poulailler_mode_lisible
        state: >
          {% set m = states('select.mode_porte_poulailler') %}
          {% if m == 'soleil' %}🌅 Lever/coucher du soleil
          {% elif m == 'luminosite' %}💡 Luminosité
          {% elif m == 'heure_fixe' %}🕐 Heure fixe
          {% elif m == 'manuel' %}🖐 Manuel
          {% else %}Inconnu
          {% endif %}

# ── Automatisations ─────────────────────────────────────────
automation:

  # Alerte erreur porte
  - id: poulailler_alerte_erreur
    alias: "Poulailler — Alerte erreur porte"
    trigger:
      - platform: mqtt
        topic: "poulailler/porte/etat"
        payload: "error"
    action:
      - service: notify.mobile_app
        data:
          title: "⚠️ Poulailler"
          message: >
            Erreur porte poulailler — vérifier l'installation.
            Heure : {{ now().strftime('%H:%M') }}

  # Alerte porte ouverte la nuit
  - id: poulailler_alerte_nuit_ouverte
    alias: "Poulailler — Porte ouverte la nuit"
    trigger:
      - platform: time
        at: "23:00:00"
    condition:
      - condition: state
        entity_id: cover.porte_poulailler
        state: "open"
    action:
      - service: notify.mobile_app
        data:
          title: "🐔 Poulailler"
          message: "La porte est encore ouverte à 23h !"

  # Alerte surcourant (courant moteur > 2 A hors mouvement normal)
  - id: poulailler_alerte_surcourant
    alias: "Poulailler — Alerte surcourant moteur"
    trigger:
      - platform: numeric_state
        entity_id: sensor.courant_moteur_poulailler
        above: 2.0
        for:
          seconds: 5
    action:
      - service: notify.mobile_app
        data:
          title: "⚡ Poulailler"
          message: >
            Surcourant détecté : {{ states('sensor.courant_moteur_poulailler') }} A
            La porte a été arrêtée automatiquement.

  # Basculer en mode manuel si HA perd la connexion MQTT
  # (optionnel — l'ESP32 continue de fonctionner en autonome)
  - id: poulailler_mode_auto_reprise
    alias: "Poulailler — Reprendre mode soleil au démarrage HA"
    trigger:
      - platform: homeassistant
        event: start
    action:
      - delay: "00:00:30"   # laisser le temps à MQTT de se reconnecter
      - service: mqtt.publish
        data:
          topic: "poulailler/mode"
          payload: "soleil"
          retain: true

# ── Helpers (input_number pour configurer depuis l'UI HA) ───
# À ajouter dans configuration.yaml ou dans des fichiers séparés
input_number:
  poulailler_offset_ouv:
    name: "Décalage ouverture (min)"
    min: -60
    max: 120
    step: 5
    unit_of_measurement: "min"
    icon: mdi:timer-plus-outline

  poulailler_offset_fer:
    name: "Décalage fermeture (min)"
    min: -60
    max: 120
    step: 5
    unit_of_measurement: "min"
    icon: mdi:timer-minus-outline

  poulailler_lux_seuil_ouv:
    name: "Seuil luminosité ouverture (lx)"
    min: 100
    max: 2000
    step: 50
    unit_of_measurement: "lx"
    icon: mdi:weather-sunny

  poulailler_lux_seuil_fer:
    name: "Seuil luminosité fermeture (lx)"
    min: 10
    max: 500
    step: 10
    unit_of_measurement: "lx"
    icon: mdi:weather-night

  poulailler_lux_confirmation:
    name: "Durée confirmation luminosité (s)"
    min: 10
    max: 300
    step: 10
    unit_of_measurement: "s"
    icon: mdi:timer-outline

# ── Automatisation : envoi config quand les sliders HA changent
automation:
  - id: poulailler_sync_config_offsets
    alias: "Poulailler — Sync offsets vers ESP32"
    trigger:
      - platform: state
        entity_id:
          - input_number.poulailler_offset_ouv
          - input_number.poulailler_offset_fer
    action:
      - service: mqtt.publish
        data:
          topic: "poulailler/config"
          payload: >
            {"offset_ouv": {{ states('input_number.poulailler_offset_ouv') | int }},
             "offset_fer": {{ states('input_number.poulailler_offset_fer') | int }}}

  - id: poulailler_sync_config_lux
    alias: "Poulailler — Sync seuils lux vers ESP32"
    trigger:
      - platform: state
        entity_id:
          - input_number.poulailler_lux_seuil_ouv
          - input_number.poulailler_lux_seuil_fer
          - input_number.poulailler_lux_confirmation
    action:
      - service: mqtt.publish
        data:
          topic: "poulailler/config"
          payload: >
            {"lux_ouv": {{ states('input_number.poulailler_lux_seuil_ouv') | int }},
             "lux_fer": {{ states('input_number.poulailler_lux_seuil_fer') | int }},
             "lux_conf": {{ states('input_number.poulailler_lux_confirmation') | int }}}

